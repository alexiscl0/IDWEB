<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tareas</title>
  </head>
  <body>
    <div class="hero">
      <p class="hero-title">Gestion de Tareas Academicas</p>
      <form action="">
        <fieldset>
          <legend>
            <img src="icons/agregar.png" id="img-agregar" alt="Nueva tarea" />
            Agregar nueva Tarea
          </legend>
          <label for="titulo"
            ><img
              src="icons/Titulo.png"
              id="img-icon"
              alt="Titulo" />Titulo</label
          >
          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Ejm: Laboratorio"
            required />

          <label for="curso"
            ><img src="icons/curso.png" id="img-icon" alt="Curso" />Curso</label
          >
          <input
            type="text"
            id="curso"
            name="curso"
            placeholder="Ejm: Estadistica"
            required />

          <label for="fecha"
            ><img src="icons/fecha.png" id="img-icon" alt="Fecha" />Fecha de
            Entrega
          </label>
          <input type="date" id="fecha" name="fecha" required />

          <input type="submit" id="btnRegistrarse" value="Registrarse" />
        </fieldset>
      </form>
      <div class="alertas"></div>
      <div class="estado">
        <button class="btn-filtro btnTodos">Todos</button>
        <button class="btn-filtro btnPendientes">Pendientes</button>
        <button class="btn-filtro btnCompletadas">Completadas</button>
      </div>
    </div>
  </body>
</html>
